plugins {
    id 'fabric-loom' version "${loom_version}"
}

version = '1.0.0-beta'
group = 'cc.tidal'
base {
    archivesName = 'tidal-1.21.11'
}

loom {
    splitEnvironmentSourceSets()

    mods {
        tidal {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${mc_1_21_11}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_1_21_11}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.141.6+1.21.11"
}

sourceSets {
    client {
        java {
            exclude 'cc/tidal/tidal/TidalCef*.java', 'org/cef/**'
        }
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}
