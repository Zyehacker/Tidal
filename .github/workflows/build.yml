name: Tidal Build

on:
  push:
    branches:
      - '**'

permissions:
  contents: read

concurrency:
  group: tidal-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Minecraft ${{ matrix.mc }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - mc: '1.21.11'
            java: '21'
          - mc: '26.2'
            java: '25'

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build Tidal for ${{ matrix.mc }}
        run: ./gradlew --no-daemon :fabric:${{ matrix.mc }}:build

      - name: Upload ${{ matrix.mc }} mod JAR
        uses: actions/upload-artifact@v7
        with:
          name: tidal-${{ matrix.mc }}-${{ github.sha }}
          path: |
            fabric/${{ matrix.mc }}/build/libs/*.jar
            !fabric/${{ matrix.mc }}/build/libs/*-sources.jar
            !fabric/${{ matrix.mc }}/build/libs/*-dev.jar
            !fabric/${{ matrix.mc }}/build/libs/*-javadoc.jar
          if-no-files-found: error
          retention-days: 14