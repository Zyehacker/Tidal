name: Tidal Build

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tidal-build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build Minecraft ${{ matrix.mc }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - mc: '1.21.11'
            java_release: 21
          - mc: '26.2'
            java_release: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 21 and 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            21
            25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Tidal for ${{ matrix.mc }}
        run: ./gradlew --no-daemon :fabric:${{ matrix.mc }}:build

      - name: Verify built jar targets Java ${{ matrix.java_release }}
        shell: bash
        run: |
          set -euo pipefail
          cd "fabric/${{ matrix.mc }}/build/libs"
          jar=$(ls *.jar | grep -vE -- '-(sources|dev|javadoc)\.jar$' | head -n1)
          max=${{ matrix.java_release }}
          echo "Checking $jar (must not target above Java $max)"

          # 1. Mixin compatibility level must not exceed the target JVM
          for cfg in $(unzip -Z1 "$jar" | grep -E '\.mixins\.json$' || true); do
            level=$(unzip -p "$jar" "$cfg" \
              | grep -oE '"compatibilityLevel"[[:space:]]*:[[:space:]]*"JAVA_[0-9]+"' \
              | grep -oE '[0-9]+' || true)
            if [ -z "$level" ]; then
              echo "::notice::$cfg has no compatibilityLevel"
              continue
            fi
            echo "$cfg -> JAVA_$level"
            if [ "$level" -gt "$max" ]; then
              echo "::error::$cfg requires JAVA_$level but this target runs on Java $max"
              exit 1
            fi
          done

          # 2. Class file version must not exceed the target JVM (Java N = major N+44)
          limit=$((max + 44))
          tmp="$RUNNER_TEMP/jarcheck"
          rm -rf "$tmp"
          unzip -q "$jar" 'cc/tidal/*' -d "$tmp" || { echo "::error::No cc/tidal classes found in $jar"; exit 1; }
          bad=0
          while IFS= read -r f; do
            major=$(od -An -tu1 -j7 -N1 "$f" | tr -d ' ')
            if [ "$major" -gt "$limit" ]; then
              echo "::error::${f#$tmp/} has class version $major (max $limit)"
              bad=1
            fi
          done < <(find "$tmp" -name '*.class')
          [ "$bad" -eq 0 ]
          echo "OK: all classes <= $limit, mixin levels <= JAVA_$max"

      - name: Upload ${{ matrix.mc }} mod JAR
        uses: actions/upload-artifact@v7
        with:
          name: tidal-${{ matrix.mc }}-${{ github.sha }}
          path: |
            fabric/${{ matrix.mc }}/build/libs/*.jar
            !fabric/${{ matrix.mc }}/build/libs/*-sources.jar
            !fabric/${{ matrix.mc }}/build/libs/*-dev.jar
            !fabric/${{ matrix.mc }}/build/libs/*-javadoc.jar
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download all JARs
        uses: actions/download-artifact@v8
        with:
          pattern: tidal-*
          merge-multiple: true
          path: release

      - name: Create checksums
        working-directory: release
        run: |
          ls -l
          sha256sum *.jar > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          flags=()
          # Tags with a hyphen (v1.0.0-beta.2) are published as pre-releases
          case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease) ;; esac

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* \
              --title "Tidal $GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag \
              "${flags[@]}"
          fi