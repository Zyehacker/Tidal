name: Tidal Build

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: tidal-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Minecraft ${{ matrix.mc }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        mc: ['1.21.11', '26.2']

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 21 and 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            21
            25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build Tidal for ${{ matrix.mc }}
        run: ./gradlew --no-daemon :fabric:${{ matrix.mc }}:build

      - name: Upload ${{ matrix.mc }} mod JAR
        uses: actions/upload-artifact@v7
        with:
          name: tidal-${{ matrix.mc }}-${{ github.sha }}
          path: |
            fabric/${{ matrix.mc }}/build/libs/*.jar
            !fabric/${{ matrix.mc }}/build/libs/*-sources.jar
            !fabric/${{ matrix.mc }}/build/libs/*-dev.jar
            !fabric/${{ matrix.mc }}/build/libs/*-javadoc.jar
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all JARs
        uses: actions/download-artifact@v8
        with:
          pattern: tidal-*
          merge-multiple: true
          path: release

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l release
          gh release create "$GITHUB_REF_NAME" release/*.jar \
            --repo "$GITHUB_REPOSITORY" \
            --title "Tidal $GITHUB_REF_NAME" \
            --generate-notes